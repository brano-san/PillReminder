name: Android

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  # Ручная сборка релиза для старого тега, где этого workflow ещё не было.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release, e.g. v1.0
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug

      # Секреты: KEYSTORE_BASE64 (base64 от release.jks), STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Restore signing key
        if: env.RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Release build
        if: env.RELEASE == 'true'
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk

      - name: GitHub release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          # Старый тег не должен отбирать метку Latest у текущего релиза.
          make_latest: ${{ inputs.tag && 'false' || 'true' }}
